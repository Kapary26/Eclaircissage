/** Liste des plantations dans l'ordre naturel des parcelles et positions. */
function pruningListBody(records) {
  return records.map(pruningRecordCard).join('');
}

function pruningRecordCard(r) {
  const type = r.pruningType;
  const hex = type ? pruningColorHex(type) : 'rgba(142,142,147,.35)';
  const info = pruningTypeInfo(type);
  const done = isPrunedRecord(r);
  const trees = getWorkloadTreeCount(r);
  const counts = getPruningCounts(r);
  const sub = [
    r.se || '—',
    pruningShapeLabel(r) === 'Plates' ? 'Plate' : 'Rond',
    r.maturityDate ? displayDate(r.maturityDate) : 'sans maturité',
    r.parcel || r.group || 'Sans parcelle',
    formatTreePosition(r),
    `${trees} arb.`,
    done && counts ? `${counts.total} ram./arbre` : ''
  ].filter(Boolean).join(' · ');
  const chipStyle = info
    ? `background:${hex};color:${contrastText(hex)};border-color:${hex}`
    : 'background:transparent;color:var(--text-2)';
  return `<article class="prune-row ${done ? 'done' : ''}" onclick="renderPruningForm('${r.id}')">
    <span class="prune-stripe" style="background:${hex}"></span>
    <div class="prune-main">
      <div class="prune-name">${escapeHtml(r.variety || 'Sans variété')}${preWorkBadge(r, 'pruning')}${done ? '<span class="prune-check">✓</span>' : ''}</div>
      <div class="prune-sub">${escapeHtml(sub)}</div>
    </div>
    <button type="button" class="prune-type-chip" style="${chipStyle}" onclick="event.stopPropagation();openPruningTypeSheet('${r.id}')">${escapeHtml(info ? pruningTypeShort(info) : '+ consigne')}</button>
  </article>`;
}

/* ----------------------------- choix multi-variétés pour une consigne groupée */

// État temporaire de la sélection : jamais enregistré dans les données terrain.
let pruningBulkCandidates = [];
let pruningBulkSelection = new Set();

/** Une variété est sélectionnée une seule fois même si plusieurs plantations sont visibles. */
function getBulkPruningCandidates() {
  const candidates = new Map();
  getFilteredPruningRecords().forEach(record => {
    const key = record.varietyId || `plantation:${record.id}`;
    if (!candidates.has(key)) candidates.set(key, { key, record, visiblePlantings: 0 });
    candidates.get(key).visiblePlantings += 1;
  });
  return Array.from(candidates.values());
}

function getBulkPruningTargets() {
  return pruningBulkCandidates.filter(item => pruningBulkSelection.has(item.key)).map(item => item.record);
}

/** Réutilise exactement la recherche, les filtres et le statut actifs du suivi taille. */
function openBulkPruningSelector() {
  pruningBulkCandidates = getBulkPruningCandidates();
  if (!pruningBulkCandidates.length) return showToast('Aucune variété ne correspond aux filtres');
  pruningBulkSelection = new Set(pruningBulkCandidates.map(item => item.key));
  renderBulkPruningSelector();
}

function renderBulkPruningSelector() {
  document.getElementById('pruningBulkSelector')?.remove();
  const selected = pruningBulkSelection.size;
  const total = pruningBulkCandidates.length;
  const f = getFilters();
  const applied = [
    f.parcels === null ? 'Toutes les parcelles' : `Parcelles : ${f.parcels.length ? f.parcels.join(', ') : 'aucune'}`,
    f.maturities === null ? 'Toutes les maturités' : `Maturités : ${f.maturities.length ? f.maturities.join(', ') : 'aucune'}`,
    f.shape ? `Typologie : ${f.shape === 'flat' ? 'Plates' : 'Rondes'}` : null,
    f.preWork ? `Pré-taille : ${f.preWork === 'done' ? 'réalisée' : 'non réalisée'}` : null,
    f.pruningType ? `Type de taille : ${f.pruningType === 'none' ? 'sans consigne' : pruningTypeLabel(f.pruningType)}` : null,
    state.pruningFilter && state.pruningFilter !== 'Toutes' ? `Statut : ${state.pruningFilter}` : null,
    state.pruningSearch ? `Recherche : ${state.pruningSearch}` : null
  ].filter(Boolean);
  const overlay = document.createElement('div');
  overlay.id = 'pruningBulkSelector';
  overlay.className = 'prune-sheet-overlay';
  overlay.innerHTML = `<section class="prune-sheet" role="dialog" aria-modal="true" aria-label="Attribution groupée de la consigne de taille">
      <div class="prune-sheet-head">
        <h2 class="prune-sheet-title">Consigne groupée</h2>
        <button type="button" class="menu-close-btn" onclick="closeBulkPruningSelector()" aria-label="Fermer">×</button>
      </div>
      <div class="prune-bulk-filters"><strong>Filtres du suivi taille :</strong> ${applied.map(escapeHtml).join(' · ')}</div>
      <p class="prune-bulk-footnote">Les ${total} variété(s) correspondant aux filtres sont présélectionnées. Décoche celles à exclure.</p>
      <div class="prune-bulk-actions">
        <button type="button" class="btn secondary" onclick="setBulkPruningAll(true)">Tout sélectionner</button>
        <button type="button" class="btn secondary" onclick="setBulkPruningAll(false)">Tout décocher</button>
      </div>
      <div class="prune-bulk-list" id="pruningBulkList">
        ${pruningBulkCandidates.map(item => {
          const r = item.record;
          const type = r.pruningType ? pruningTypeLabel(r.pruningType) : 'Sans consigne';
          const parcelInfo = item.visiblePlantings > 1 ? `${item.visiblePlantings} implantations affichées` : (r.parcel || r.group || 'Sans parcelle');
          return `<label class="prune-bulk-row">
            <input type="checkbox" data-bulk-key="${escapeAttr(item.key)}" ${pruningBulkSelection.has(item.key) ? 'checked' : ''}>
            <span class="prune-bulk-detail">
              <span class="prune-bulk-name">${escapeHtml(r.variety || r.denomination || 'Variété sans nom')}</span>
              <span class="prune-bulk-meta">${escapeHtml(parcelInfo)} · ${escapeHtml(type)}</span>
            </span>
          </label>`;
        }).join('')}
      </div>
      <p class="prune-bulk-count" id="pruningBulkCount">${selected} variété(s) sélectionnée(s) sur ${total}</p>
      <button type="button" class="btn green" id="pruningBulkContinue" onclick="continueBulkPruning()" ${selected ? '' : 'disabled'}>Choisir la consigne</button>
      <p class="prune-bulk-footnote">La consigne sera également reportée sur toutes les autres implantations de chaque variété sélectionnée, y compris hors des parcelles filtrées. Les comptages réels et les dates ne seront pas modifiés.</p>
    </section>`;
  overlay.addEventListener('click', event => {
    if (event.target === overlay) closeBulkPruningSelector();
  });
  overlay.addEventListener('change', event => {
    if (!event.target.matches('input[data-bulk-key]')) return;
    if (event.target.checked) pruningBulkSelection.add(event.target.dataset.bulkKey);
    else pruningBulkSelection.delete(event.target.dataset.bulkKey);
    updateBulkPruningCount();
  });
  document.body.appendChild(overlay);
}

function updateBulkPruningCount() {
  const count = document.getElementById('pruningBulkCount');
  if (count) count.textContent = `${pruningBulkSelection.size} variété(s) sélectionnée(s) sur ${pruningBulkCandidates.length}`;
  const button = document.getElementById('pruningBulkContinue');
  if (button) button.disabled = !pruningBulkSelection.size;
}

function setBulkPruningAll(checked) {
  pruningBulkSelection = checked ? new Set(pruningBulkCandidates.map(item => item.key)) : new Set();
  document.querySelectorAll('#pruningBulkList input[data-bulk-key]').forEach(input => { input.checked = checked; });
  updateBulkPruningCount();
}

function closeBulkPruningSelector() {
  document.getElementById('pruningBulkSelector')?.remove();
}

function continueBulkPruning() {
  if (!pruningBulkSelection.size) return showToast('Sélectionner au moins une variété');
  closeBulkPruningSelector();
  openPruningTypeSheet('BULK');
}

/* ------------------------------------------------- feuille de choix du type */

function openPruningTypeSheet(id) {
  const bulk = id === 'BULK';
  const record = bulk ? null : state.records.find(r => r.id === id);
  if (!bulk && !record) return;
  const targets = bulk ? getBulkPruningTargets() : [record];
  if (bulk && !targets.length) return showToast('Aucune variété sélectionnée');
  const current = bulk ? '' : record.pruningType;
  document.getElementById('pruningTypeSheet')?.remove();
  const overlay = document.createElement('div');
  overlay.id = 'pruningTypeSheet';
  overlay.className = 'prune-sheet-overlay';
  overlay.innerHTML = `<section class="prune-sheet" role="dialog" aria-modal="true">
      <div class="prune-sheet-head">
        <h2 class="prune-sheet-title">${bulk ? `Consigne pour ${targets.length} variété(s)` : escapeHtml(record.variety || 'Variété')}</h2>
        <button class="menu-close-btn" onclick="closePruningTypeSheet()" aria-label="Fermer">×</button>
      </div>
      <p class="muted small" style="margin:0 0 12px">Le type de taille détermine la couleur du piquet posé au pied de la variété.</p>
      <div class="prune-type-grid">
        ${getPruningTypes().map(t => {
          const hex = pruningColorHex(t.key);
          return `<button type="button" class="prune-type-btn ${current === t.key ? 'active' : ''}" onclick="choosePruningType('${escapeAttr(id)}','${t.key}')">
            <span class="prune-dot lg" style="background:${hex}"></span>
            <span>
              <span class="prune-type-title">${escapeHtml(t.label)} · piquet ${escapeHtml(pruningColorName(hex).toLowerCase())}</span>
              <span class="prune-type-hint">${escapeHtml(t.hint)}</span>
            </span>
          </button>`;
        }).join('')}
        <button type="button" class="prune-type-btn" onclick="choosePruningType('${escapeAttr(id)}','')">
          <span class="prune-dot lg" style="background:rgba(142,142,147,.35)"></span>
          <span><span class="prune-type-title">Retirer la consigne</span><span class="prune-type-hint">Aucun piquet posé</span></span>
        </button>
      </div>
    </section>`;
  overlay.addEventListener('click', event => { if (event.target === overlay) closePruningTypeSheet(); });
  document.body.appendChild(overlay);
}

function closePruningTypeSheet() {
  document.getElementById('pruningTypeSheet')?.remove();
}

async function choosePruningType(id, typeKey) {
  const bulk = id === 'BULK';
  const targets = bulk ? getBulkPruningTargets() : state.records.filter(r => r.id === id);
  if (!targets.length) return showToast('Aucune variété sélectionnée');
  const varietyIds = new Set(targets.map(t => t.varietyId).filter(Boolean));
  if (bulk) {
    const label = typeKey ? pruningTypeLabel(typeKey) : 'Sans consigne';
    const targetIds = new Set(targets.map(t => t.id));
    const affected = state.records.filter(r => targetIds.has(r.id) || (r.varietyId && varietyIds.has(r.varietyId)));
    const replacing = affected.filter(r => r.pruningType && r.pruningType !== typeKey).length;
    const finishedReset = !typeKey ? affected.filter(r => r.pruningFinished).length : 0;
    const message = `Appliquer « ${label} » à ${targets.length} variété(s), soit ${affected.length} implantation(s) sur toutes les parcelles ?` +
      (replacing ? `\n${replacing} implantation(s) avec une consigne différente seront mises à jour.` : '') +
      (finishedReset ? `\nAttention : ${finishedReset} taille(s) terminée(s) repasseront à « à tailler » car la consigne est retirée.` : '') +
      '\nLes comptages et les dates resteront inchangés.';
    if (!confirm(message)) return;
  }
  targets.forEach(target => {
    const record = state.records.find(r => r.id === target.id);
    if (!record) return;
    record.pruningType = typeKey;
    if (!typeKey) record.pruningFinished = false;
    record.lastModified = new Date().toISOString();
    recalculateRecord(record);
  });
  // Toutes les plantations d'une même variété partagent la même consigne.
  state.records.forEach(record => {
    if (!varietyIds.has(record.varietyId) || targets.some(t => t.id === record.id)) return;
    record.pruningType = typeKey;
    if (!typeKey) record.pruningFinished = false;
    record.lastModified = new Date().toISOString();
    recalculateRecord(record);
  });
  await saveLocalData(false);
  closePruningTypeSheet();
  showToast(typeKey
    ? `${pruningTypeLabel(typeKey)} · ${pruningStakeLabel(typeKey).toLowerCase()}${bulk ? ` (${targets.length})` : ''}`
    : 'Consigne retirée');
  if (state.currentView === 'pruningForm' && !bulk) renderPruningForm(id);
  else renderPruningList();
}

/* --------------------------------------------------------------- fiche taille */

function renderPruningForm(id) {
  const record = state.records.find(r => r.id === id);
  if (!record) return renderPruningList();
  recalculateRecord(record);
  state.selectedId = record.id;
  state.currentView = 'pruningForm';

  const type = record.pruningType;
  const hex = type ? pruningColorHex(type) : '';
  const counts = getPruningCounts(record);
  const done = isPrunedRecord(record);
  const canFinish = canFinishPruning(record);
  const message = getPruningValidationMessage(record);
  const siblings = record.varietyId ? state.records.filter(r => r.varietyId === record.varietyId).length : 1;

  app.innerHTML = `<header class="form-sticky-header">
      <div class="form-header-grid">
        <button class="back-btn" onclick="renderPruningList()"><span>Retour</span></button>
        <div class="form-title-block">
          <div class="form-title-main">${escapeHtml(record.variety || 'Fiche taille')}</div>
          <div class="form-title-sub only-location">${escapeHtml(`${record.parcel || record.group || '—'} · ${formatTreePosition(record)} · ${getWorkloadTreeCount(record)} arbres`)}</div>
        </div>
        <button class="icon-btn reset-form-btn" onclick="resetPruningRecord('${record.id}')"><span>Réinit.</span></button>
      </div>
    </header>
    <main class="content grid form-content">
      <section class="card">
        <h2 class="section-title">🪧 Consigne de taille</h2>
        ${type
          ? `<div class="prune-badge" style="background:${hex};color:${contrastText(hex)};border-color:${hex}"><span class="prune-dot" style="background:${contrastText(hex)};opacity:.85"></span>${escapeHtml(pruningTypeLabel(type))} · ${escapeHtml(pruningStakeLabel(type).toLowerCase())}</div>`
          : '<div class="prune-badge empty">Aucune consigne définie</div>'}
        <button class="btn secondary" style="margin-top:10px" onclick="openPruningTypeSheet('${record.id}')">${type ? 'Changer la consigne' : 'Définir la consigne'}</button>
        ${siblings > 1 ? `<p class="prune-note">Consigne partagée par les ${siblings} parcelles de cette variété. Le comptage ci-dessous ne concerne que ${escapeHtml(record.parcel || 'cette parcelle')}.</p>` : ''}
        ${preWorkToggle(record, 'pruning')}
      </section>

      <section class="card">
        <h2 class="section-title">📅 Réalisation</h2>
        <div class="fields">
          <div class="field"><label>Date de taille</label><input type="date" data-prune-field="pruningDate" value="${escapeAttr(record.pruningDate || '')}"></div>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">🌿 Comptage après taille</h2>
        <div class="prune-count-head"><div>Rameaux laissés</div><div>Nombre</div></div>
        ${[['small', 'Petits'], ['medium', 'Moyens'], ['large', 'Gros']].map(([key, label]) => `
          <div class="prune-count-row">
            <div class="prune-count-label"><span class="prune-dot sm" style="background:${pruningColorHex(key)}"></span>${label}</div>
            <input type="number" inputmode="numeric" min="0" step="1" data-prune-field="${PRUNING_COUNT_FIELDS[key]}" value="${escapeAttr(record[PRUNING_COUNT_FIELDS[key]] ?? '')}" placeholder="0">
          </div>`).join('')}
        <div class="prune-total-box">
          <div class="prune-total-label">Total / arbre</div>
          <div class="prune-total-value">${counts ? counts.total : '—'}</div>
        </div>
        <p class="prune-note">Comptage réalisé sur un arbre témoin. C’est cette donnée qui sert à estimer le nombre de fruits par arbre lors de l’éclaircissage.</p>
      </section>

      <section class="card">
        <h2 class="section-title">💬 Commentaire taille</h2>
        <div class="field"><textarea data-prune-field="pruningComment" placeholder="Vigueur, casse, rajeunissement…">${escapeHtml(record.pruningComment || '')}</textarea></div>
      </section>
      <div class="form-spacer-bottom"></div>
    </main>
    ${!canFinish ? `<div class="finish-help">${escapeHtml(message)}</div>` : ''}
    <button class="btn green sticky-finish" onclick="finishPruning('${record.id}')" ${canFinish ? '' : 'disabled'}>${done ? 'Taille terminée ✓' : 'Taille terminée'}</button>`;

  document.querySelectorAll('[data-prune-field]').forEach(el => {
    el.addEventListener('change', e => updatePruningField(record.id, e.target.dataset.pruneField, e.target.value, true));
    el.addEventListener('input', debounce(e => updatePruningField(record.id, e.target.dataset.pruneField, e.target.value, false), 200));
  });
}

function updatePruningField(id, field, value, rerender = true) {
  const record = state.records.find(r => r.id === id);
  if (!record || !field) return;
  record[field] = value;
  record.lastModified = new Date().toISOString();
  recalculateRecord(record);
  if (record.pruningFinished && hasCompletePruningCounts(record)) applyPruningCountsToStructure(record.id, true);
  saveLocalData(false);
  if (rerender) renderPruningForm(id);
  else {
    const btn = document.querySelector('.sticky-finish');
    if (btn) btn.disabled = !canFinishPruning(record);
  }
}

function finishPruning(id) {
  const record = state.records.find(r => r.id === id);
  if (!record) return;
  recalculateRecord(record);
  if (!canFinishPruning(record)) {
    showToast(getPruningValidationMessage(record) || 'Saisie incomplète');
    return renderPruningForm(id);
  }
  record.pruningFinished = true;
  record.lastModified = new Date().toISOString();
  recalculateRecord(record);
  applyPruningCountsToStructure(record.id, true);
  saveLocalData(false);
  showToast('Taille terminée');
  renderPruningList();
}

async function resetPruningRecord(id) {
  const record = state.records.find(r => r.id === id);
  if (!record) return;
  if (!confirm('Réinitialiser la saisie de taille de cette variété ? (la consigne piquet est conservée)')) return;
  record.pruningDate = '';
  record.pruningComment = '';
  record.pruningFinished = false;
  Object.values(PRUNING_COUNT_FIELDS).forEach(field => { record[field] = ''; });
  record.lastModified = new Date().toISOString();
  recalculateRecord(record);
  await saveLocalData(false);
  showToast('Saisie de taille réinitialisée');
  renderPruningForm(id);
}

/* ------------------------------------------------------ consignes / piquets */

function renderPruningInstructions() {
  lockViewportMobile();
  state.currentView = 'pruningInstructions';
  const stats = getPruningStats();
  const records = state.records.map(recalculateRecord);
  const parcels = unique(records.map(r => r.parcel || r.group || 'Sans parcelle'));

  const parcelBlocks = parcels.map(parcel => {
    const items = records.filter(r => (r.parcel || r.group || 'Sans parcelle') === parcel);
    const groups = getPruningTypes().map(t => {
      const list = items.filter(r => r.pruningType === t.key).sort((a, b) => num(a.row) - num(b.row) || num(a.treeStart) - num(b.treeStart));
      if (!list.length) return '';
      const hex = pruningColorHex(t.key);
      const trees = list.reduce((sum, r) => sum + getWorkloadTreeCount(r), 0);
      return `<div class="prune-group">
        <div class="prune-group-head"><span class="prune-dot" style="background:${hex}"></span>${escapeHtml(t.label)} · piquet ${escapeHtml(pruningColorName(hex).toLowerCase())} — ${list.length} var. / ${trees} arbres</div>
        ${list.map(r => `<div class="prune-instruction-item">
          <span class="prune-dot sm" style="background:${hex}"></span>
          <span>${escapeHtml(r.variety || 'Sans variété')}${hasPreWork(r, 'pruning') ? ' 🚧' : ''}${isPrunedRecord(r) ? ' ✓' : ''}</span>
          <span class="prune-instruction-pos">${escapeHtml(formatTreePosition(r))} · ${getWorkloadTreeCount(r)} arb.</span>
        </div>`).join('')}
      </div>`;
    }).join('');
    const without = items.filter(r => !r.pruningType);
    const withoutBlock = without.length ? `<div class="prune-group">
        <div class="prune-group-head"><span class="prune-dot" style="background:rgba(142,142,147,.35)"></span>Sans consigne — ${without.length} var.</div>
        ${without.map(r => `<div class="prune-instruction-item">
          <span class="prune-dot sm" style="background:rgba(142,142,147,.35)"></span>
          <span>${escapeHtml(r.variety || 'Sans variété')}</span>
          <span class="prune-instruction-pos">${escapeHtml(formatTreePosition(r))}</span>
        </div>`).join('')}
      </div>` : '';
    if (!groups && !withoutBlock) return '';
    return `<section class="card">
      <h2 class="prune-parcel-title"><span>${escapeHtml(parcel)}</span><span class="muted small">${items.length} var.</span></h2>
      ${groups}${withoutBlock}
    </section>`;
  }).join('');

  app.innerHTML = `<header class="topbar prune-noprint"><div class="topbar-row">
      <button class="back-btn" onclick="renderPruningList()"><span>Retour</span></button>
      <div class="title-wrap" style="text-align:center"><h1 class="app-title">Consignes piquets</h1><p class="subtitle">Code couleur taille par variété</p></div>
      <button class="icon-btn" onclick="window.print()"><span>Imprimer</span></button>
    </div></header>
    <main class="content grid">
      <section class="card">
        <h2 class="section-title">🎨 Légende des piquets</h2>
        ${getPruningTypes().map(t => {
          const hex = pruningColorHex(t.key);
          const data = stats.byType[t.key] || { varieties: 0, trees: 0, done: 0 };
          return `<div class="prune-legend-row">
            <span class="prune-dot lg" style="background:${hex}"></span>
            <span class="prune-legend-text">
              <span class="prune-legend-title">${escapeHtml(t.label)} — piquet ${escapeHtml(pruningColorName(hex).toLowerCase())}</span>
              <span class="prune-legend-sub">${data.varieties} variété(s) · ${data.trees} arbres · ${data.done} taillée(s)</span>
              ${t.hint ? `<span class="prune-legend-sub">${escapeHtml(t.hint)}</span>` : ''}
            </span>
            <button type="button" class="prune-edit-btn prune-noprint" onclick="openPruningTypeEditor('${escapeAttr(t.key)}')">Modifier</button>
          </div>`;
        }).join('')}
        <button class="btn secondary prune-noprint" style="margin-top:12px" onclick="openPruningTypeEditor('')">➕ Nouveau type de taille</button>
        <p class="prune-note">Chaque type correspond à une couleur de piquet. Le comptage après taille reste toujours réparti en petits / moyens / gros rameaux.</p>
      </section>

      <section class="card">
        <h2 class="section-title">📋 Récapitulatif</h2>
        <div class="read-grid">
          ${readTile('Variétés', stats.total)}
          ${readTile('Avec consigne', stats.withType)}
          ${readTile('Sans consigne', stats.without)}
          ${readTile('Taillées', stats.done)}
        </div>
      </section>

      ${parcelBlocks || '<div class="empty">Aucune variété enregistrée.</div>'}
      <div class="form-spacer-bottom prune-noprint"></div>
    </main>`;
}

/* ------------------------------------------------------------------- export */

function pruningExportRow(r) {
  const counts = getPruningCounts(r);
  const hex = r.pruningType ? pruningColorHex(r.pruningType) : '';
  return {
    'parcelle': r.parcel || r.group || '',
    'SE': r.se || '',
    'variété': r.variety || '',
    'dénomination': r.denomination || '',
    'rang': r.row || '',
    'arbre de début': r.treeStart || '',
    'arbre de fin': r.treeEnd || '',
    'nb arbres': getWorkloadTreeCount(r),
    'type de taille': r.pruningType ? pruningTypeLabel(r.pruningType) : '',
    'couleur piquet': hex ? pruningColorName(hex) : '',
    'date de taille': r.pruningDate || '',
    'petits rameaux laissés': counts ? counts.small : '',
    'rameaux moyens laissés': counts ? counts.medium : '',
    'gros rameaux laissés': counts ? counts.large : '',
    'total rameaux/arbre': counts ? counts.total : '',
    'pré-taille réalisée': hasPreWork(r, 'pruning') ? 'oui' : '',
    'statut taille': isPrunedRecord(r) ? 'taille réalisée' : (r.pruningType ? 'à tailler' : 'sans consigne'),
    'commentaire taille': r.pruningComment || ''
  };
}

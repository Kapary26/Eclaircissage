}

function estimateDetailSections(record) {
  const shoots = getShootCounts(record);
  const tolerance = getChargeTolerance(record.recommendedLoad);
  const lower = (record.recommendedLoad !== '' && tolerance !== '') ? Number(record.recommendedLoad) - Number(tolerance) : '';
  const upper = (record.recommendedLoad !== '' && tolerance !== '') ? Number(record.recommendedLoad) + Number(tolerance) : '';
  const branchLabel = key => {
    const b = record.branches?.[key] || {};
    const before = b.before !== undefined && b.before !== '' ? b.before : '—';
    const after = b.remaining !== undefined && b.remaining !== '' ? b.remaining : '—';
    return `${before} → ${after}`;
  };

  const sections = [];

  sections.push(estimateSection('Données saisies', [
    ['Petit rameau', branchLabel('small')],
    ['Rameau moyen', branchLabel('medium')],
    ['Gros rameau', branchLabel('large')],
    ['Petits rameaux/arbre', shoots ? String(shoots.small) : 'à compter en taille'],
    ['Rameaux moyens/arbre', shoots ? String(shoots.medium) : 'à compter en taille'],
    ['Gros rameaux/arbre', shoots ? String(shoots.large) : 'à compter en taille'],
    ['Total rameaux/arbre', shoots ? String(shoots.large + shoots.medium + shoots.small) : 'à compter en taille']
  ], 'Fruits avant → après sur les rameaux observés. Le nombre de rameaux par arbre vient du comptage réalisé à la taille.'));

  sections.push(estimateSection('Calcul sur rameaux observés', [
    ['Total fruits avant', estimateValue(record.totalBefore)],
    ['Total fruits après', estimateValue(record.totalRemaining)],
    ['Total fruits retirés', estimateValue(record.totalRemoved)],
    ['Taux calculé', record.calculatedRate !== '' ? `${record.calculatedRate} %` : '—']
  ]));

  sections.push(estimateSection('Estimation à l’arbre', [
    ['Fruits estimés avant/arbre', estimateValue(record.estimatedFruitBeforeTree, ' fruits')],
    ['Fruits estimés après/arbre', estimateValue(record.estimatedFruitAfterTree, ' fruits')],
    ['Fruits retirés estimés/arbre', estimateValue(record.estimatedFruitRemovedTree, ' fruits')],
    ['Taux pondéré', record.estimatedWeightedRate !== '' ? `${record.estimatedWeightedRate} %` : '—']
  ], 'La classe et la charge réelle restent affichées dans la fiche principale pour éviter les répétitions.'));

  sections.push(estimateSection('Référence charge', [
    ['Charge recommandée', record.recommendedLoad ? `${record.recommendedLoad} fruits/arbre` : '—'],
    ['Tolérance utilisée', tolerance !== '' ? `± ${tolerance} fruits` : '—'],
    ['Intervalle acceptable', lower !== '' && upper !== '' ? `${lower} à ${upper} fruits/arbre` : '—'],
    ['Écart exact', record.estimatedLoadGap !== '' ? `${Number(record.estimatedLoadGap) > 0 ? '+' : ''}${record.estimatedLoadGap} fruits` : '—']
  ], 'La pastille Charge réelle devient verte si elle reste dans cet intervalle, rouge sinon.'));

  return sections.join('');
}

function branchInputCompact(label, key, record) {
  const b = record.branches?.[key] || {};
  return `<div class="branch-compact">
    <div class="branch-name">${escapeHtml(label)}</div>
    <div class="branch-mini-field"><input type="number" inputmode="numeric" min="0" step="1" aria-label="${escapeAttr(label)} avant" data-field="branches.${key}.before" value="${escapeAttr(b.before ?? '')}"></div>
    <div class="branch-mini-field"><input type="number" inputmode="numeric" min="0" step="1" aria-label="${escapeAttr(label)} après" data-field="branches.${key}.remaining" value="${escapeAttr(b.remaining ?? '')}"></div>
  </div>`;
}

function degroupingBranchInputCompact(label, key, record) {
  const b = record.branches?.[key] || {};
  return `<div class="branch-compact degrouping-branch">
    <div class="branch-name">${escapeHtml(label)}</div>
    <div class="branch-mini-field single"><label>Fruits après dégroupement</label><input type="number" inputmode="numeric" min="0" step="1" data-field="branches.${key}.remaining" value="${escapeAttr(b.remaining ?? '')}"></div>
  </div>`;
}

function hasCompleteBranchCounts(record) {
  return ['small', 'medium', 'large'].every(key => {
    const b = record.branches?.[key] || {};
    return numberOrBlank(b.before) !== '' && numberOrBlank(b.remaining) !== '';
  });
}

function hasValidBranchCounts(record) {
  if (!hasCompleteBranchCounts(record)) return false;
  return ['small', 'medium', 'large'].every(key => {
    const b = record.branches?.[key] || {};
    const before = numberOrBlank(b.before);
    const remaining = numberOrBlank(b.remaining);
    return before !== '' && remaining !== '' && before >= 0 && remaining >= 0 && remaining <= before;
  });
}

function canFinishThinning(record) {
  if (!record.completionDate) return false;
  if (!hasCompleteShootCounts(record)) return false;
  return hasValidBranchCounts(record) && record.estimatedFruitAfterTree !== '';
}

function getFinishValidationMessage(record) {
  if (!record.completionDate) return 'Renseigner la date de réalisation';
  if (!hasCompleteShootCounts(record)) return 'Compter les rameaux dans Suivi taille';
  if (!hasCompleteBranchCounts(record)) return 'Remplir les fruits avant/après des 3 rameaux';
  if (!hasValidBranchCounts(record)) return 'Corriger les valeurs : après ≤ avant';
  return '';
}

function statCard(label, value) {
  return `<div class="card compact"><div class="big-number">${escapeHtml(value)}</div><div class="muted small">${escapeHtml(label)}</div></div>`;
}
function miniTable(obj, headers) {
  const rows = Object.entries(obj).sort((a,b) => b[1]-a[1]);
  if (!rows.length) return '<p class="muted">Aucune donnée.</p>';
  return `<div class="table-wrap"><table><thead><tr><th>${headers[0]}</th><th>${headers[1]}</th></tr></thead><tbody>${rows.map(([k,v]) => `<tr><td>${escapeHtml(k)}</td><td>${v}</td></tr>`).join('')}</tbody></table></div>`;
}
function workloadTable(workload) {
  if (!workload.length) return '<p class="muted">Aucune charge de travail calculable.</p>';
  return `<div class="table-wrap"><table><thead><tr><th>Semaine</th><th>P1P2</th><th>AO P9C</th><th>IRTA</th><th>Autres</th><th>Total</th><th>Réalisées</th><th>Restantes</th><th>Heures</th><th>Niveau</th></tr></thead><tbody>${workload.map(w => `<tr><td>${escapeHtml(w.week)}</td><td>${w.P1P2}</td><td>${w['AO P9C']}</td><td>${w.IRTA}</td><td>${w.others}</td><td>${w.total}</td><td>${w.done}</td><td>${w.remaining}</td><td>${w.hours}</td><td>${escapeHtml(w.level)}</td></tr>`).join('')}</tbody></table></div>`;
}

function getStats() {
  const total = state.records.length;
  const done = state.records.filter(r => isDoneRecord(r)).length;
  const observed = state.records.filter(r => r.completionDate || isDoneRecord(r)).length;
  const rates = state.records.map(r => Number(r.calculatedRate)).filter(Number.isFinite);
  const hist = state.records.map(r => Number(r.historicalRate)).filter(Number.isFinite);
  return {
    total,
    done,
    progress: total ? Math.round(done / total * 100) : 0,
    observed,
    ready: state.records.filter(r => r.status === 'prête à éclaircir').length,
    thinned: state.records.filter(r => isDoneRecord(r)).length,
    finalChecks: 0,
    toCheck: 0,
    urgent: state.records.filter(r => ['Urgent', 'Haute'].includes(r.priority)).length,
    late: state.records.filter(isLate).length,
    avgRate: rates.length ? round1(rates.reduce((a,b)=>a+b,0)/rates.length) : '',
    avgHistoricalRate: hist.length ? round1(hist.reduce((a,b)=>a+b,0)/hist.length) : ''
  };
}

function getQualityAlerts() {
  const alerts = [];
  state.records.forEach(r => {
    const name = `${r.variety || 'Sans variété'} (${r.parcel || r.group || '—'})`;
    if (isDoneRecord(r) && !r.completionDate) alerts.push({ title: 'Éclaircissage fini sans date', detail: name });
    if (r.calculatedRate !== '' && !r.status) alerts.push({ title: 'Taux calculé sans statut', detail: name });
    if (Number(r.calculatedRate) === 0 && !r.comment) alerts.push({ title: 'Taux 0 % sans commentaire', detail: name });
    if (Number(r.calculatedRate) >= 80 && !r.comment) alerts.push({ title: 'Taux 4/5+ sans commentaire', detail: name });
    if (r.hasInvalidCounts) alerts.push({ title: 'Fruits restants supérieurs aux fruits initiaux', detail: name });
    
    
    const d = diffDays(todayISO(), r.correctedThinningDate);
    if (!isDoneRecord(r) && d !== null && d <= 7 && d >= 0) alerts.push({ title: 'Date proche non finie', detail: name });
    if (Number(r.historicalRate) >= 66 && !isDoneRecord(r)) alerts.push({ title: 'Taux historique élevé non fini', detail: name });
    if (isLate(r)) alerts.push({ title: 'Date théorique d’éclaircissage dépassée', detail: name });
  });
  return alerts.slice(0, 80);
}

function recordHistoryKey(record) {
  return normalizeKey([record?.se, record?.variety, record?.denomination, record?.parcel || record?.group, record?.row, record?.treeStart, record?.treeEnd].join('|'));
}

function getObservationYear(record) {
  const d = parseISODate(record?.completionDate) || parseISODate(todayISO());
  return d ? d.getUTCFullYear() : new Date().getFullYear();
}

function getMaturityYear(record) {
  const d = parseISODate(record?.maturityDate);
  return d ? d.getUTCFullYear() : new Date().getFullYear();
}

function upsertHistoryEntry(entry) {
  if (!Array.isArray(state.history)) state.history = [];
  const key = String(entry.key || '');
  const year = String(entry.year || '');
  const idx = state.history.findIndex(h => String(h.key) === key && String(h.year) === year);
  const clean = { ...(idx >= 0 ? state.history[idx] : {}), ...entry, updatedAt: new Date().toISOString() };
  if (idx >= 0) state.history[idx] = clean;
  else state.history.push(clean);
}

function upsertThinningHistory(record) {
  if (!record || !canFinishThinning(record)) return;
  const year = getObservationYear(record);
  upsertHistoryEntry({
    key: recordHistoryKey(record),
    recordId: record.id,
    year,
    type: 'eclaircissage',
    se: record.se || '',
    variety: record.variety || '',
    denomination: record.denomination || '',
    parcel: record.parcel || record.group || '',
    row: record.row || '',
    treeStart: record.treeStart || '',
    treeEnd: record.treeEnd || '',
    treeCount: record.treeCount || '',
    stoneHardeningDate: record.stoneHardeningDate || '',
    completionDate: record.completionDate || '',
    rate: record.calculatedRate !== '' ? record.calculatedRate : record.estimatedWeightedRate,
    class: record.calculatedRateClass || record.estimatedRateClass || '',
    realLoad: record.estimatedFruitAfterTree !== '' ? record.estimatedFruitAfterTree : '',
    recommendedLoad: record.recommendedLoad || '',
    shootLarge: getShootCounts(record) ? getShootCounts(record).large : '',
    shootMedium: getShootCounts(record) ? getShootCounts(record).medium : '',
    shootSmall: getShootCounts(record) ? getShootCounts(record).small : '',
    comment: record.comment || ''
  });
}

function removeCurrentYearHistory(record) {
  if (!Array.isArray(state.history) || !record) return;
  const key = recordHistoryKey(record);
  const year = String(getObservationYear(record));
  state.history = state.history.filter(h => !(String(h.key) === key && String(h.year) === year));
}

function updateMaturityHistoryFromImported(records) {
  if (!Array.isArray(records)) return;
  records.forEach(r => {
    if (!r || !r.maturityDate) return;
    upsertHistoryEntry({
      key: recordHistoryKey(r),
      recordId: r.id,
      year: getMaturityYear(r),
      type: 'maturite',
      se: r.se || '',
      variety: r.variety || '',
      denomination: r.denomination || '',
      parcel: r.parcel || r.group || '',
      row: r.row || '',
      treeStart: r.treeStart || '',
      treeEnd: r.treeEnd || '',
      treeCount: r.treeCount || '',
      maturityDate: r.maturityDate,
      maturityDay: getDayOfYear(r.maturityDate)
    });
  });
}

function getHistoryEntriesForRecord(record) {
  const key = recordHistoryKey(record);
  return Array.isArray(state.history) ? state.history.filter(h => String(h.key) === key) : [];
}

function getHistoricalAverageMaturityDay(record) {
  const days = getHistoryEntriesForRecord(record).map(h => Number(h.maturityDay || getDayOfYear(h.maturityDate))).filter(n => Number.isFinite(n) && n > 0);
  if (!days.length) return '';
  return Math.round(days.reduce((a,b) => a + b, 0) / days.length);
}

function dateFromDayOfYear(year, day) {
  const d = new Date(Date.UTC(Number(year), 0, 1));
  d.setUTCDate(Number(day));
  return toISODate(d);
}

function getHistoricalMaturityDate(record) {
  const day = getHistoricalAverageMaturityDay(record);
  if (!day) return '';
  const base = parseISODate(record?.maturityDate) || parseISODate(todayISO());
  return dateFromDayOfYear(base.getUTCFullYear(), day);
}

function getHistoricalAverageRate(record) {
  const rates = getHistoryEntriesForRecord(record).map(h => Number(h.rate)).filter(n => Number.isFinite(n));
  if (!rates.length) return '';
  return round1(rates.reduce((a,b) => a + b, 0) / rates.length);
}

function getHistoricalTimeCoefficient(record) {
  const rate = getHistoricalAverageRate(record);
  if (rate === '') return 1;
  if (rate < 20) return 0.6;
  if (rate < 33) return 0.8;
  if (rate < 50) return 1.0;
  if (rate < 66) return 1.2;
  if (rate < 80) return 1.4;
  return 1.6;
}

function getHistorySummaries(sourceRows) {
  const map = new Map();
  (sourceRows || state.history || []).forEach(h => {
    const key = h.key || recordHistoryKey(h);
    if (!map.has(key)) map.set(key, { key, variety: h.variety, denomination: h.denomination, yearsSet: new Set(), maturityDays: [], rates: [] });
    const item = map.get(key);
    if (h.year) item.yearsSet.add(String(h.year));
    const day = Number(h.maturityDay || getDayOfYear(h.maturityDate));
    if (Number.isFinite(day) && day > 0) item.maturityDays.push(day);
    const rate = Number(h.rate);
    if (Number.isFinite(rate)) item.rates.push(rate);
  });
  return [...map.values()].map(item => {
    const avgDay = item.maturityDays.length ? Math.round(item.maturityDays.reduce((a,b)=>a+b,0) / item.maturityDays.length) : '';
    return {
      ...item,
      years: item.yearsSet.size,
      avgMaturityDay: avgDay,
      avgMaturityLabel: avgDay ? displayDate(dateFromDayOfYear(new Date().getFullYear(), avgDay)).slice(0,5) : '',
      avgRate: item.rates.length ? round1(item.rates.reduce((a,b)=>a+b,0) / item.rates.length) : ''
    };
  }).sort((a,b) => String(a.variety || '').localeCompare(String(b.variety || ''), 'fr', { numeric:true, sensitivity:'base' }));
}

function getHistorySummaryForKey(key) {
  return getHistorySummaries((state.history || []).filter(h => String(h.key) === String(key)))[0] || null;
}

function resetCurrentObservation(id) {
  const record = state.records.find(r => r.id === id);
  if (!record) return;
  if (!confirm('Réinitialiser la saisie de cette variété pour l’année en cours ?')) return;
  removeCurrentYearHistory(record);
  record.shootLarge = '';
  record.shootMedium = '';
  record.shootSmall = '';
  record.completionDate = '';
  record.observationDate = '';
  record.stoneHardeningDate = '';
  record.branches = emptyBranches();
  record.comment = '';
  record.finished = false;
  record.thinningFinished = false;
  record.status = 'à observer';
  record.lastModified = new Date().toISOString();
  recalculateRecord(record);
  saveLocalData(false);
  showToast('Saisie réinitialisée');
  renderForm(id);
}

function mergeRecords(oldRecords, newRecords) {
  const map = new Map(oldRecords.map(r => [r.id, r]));
  newRecords.forEach(r => {
    if (map.has(r.id)) map.set(r.id, { ...r, ...map.get(r.id), lastModified: new Date().toISOString() });
    else map.set(r.id, r);
  });
  return [...map.values()].map(recalculateRecord);
}

function emptyBranches() {
  return {
    small: { before: '', remaining: '', removed: '', rate: '' },
    medium: { before: '', remaining: '', removed: '', rate: '' },
    large: { before: '', remaining: '', removed: '', rate: '' }
  };
}
function cleanCell(v) { return isBlankOrExcelError(v) ? '' : String(v).trim(); }
function isBlankOrExcelError(v) { return v === null || v === undefined || String(v).trim() === '' || /^#(REF|VALUE|N\/A|DIV\/0|NAME|NULL|NUM)!?$/i.test(String(v).trim()); }
function parseRate(v) { if (isBlankOrExcelError(v)) return ''; const s = String(v).replace('%','').replace(',','.').trim(); const n = Number(s); return Number.isFinite(n) ? round1(n) : ''; }
function numberOrBlank(v) { if (v === '' || v === null || v === undefined) return ''; const n = Number(v); return Number.isFinite(n) ? n : ''; }
function terrainNumber(v) { const m = String(v ?? '').match(/-?\d+(?:[,.]\d+)?/); if (!m) return 999999; const n = Number(m[0].replace(',', '.')); return Number.isFinite(n) ? n : 999999; }
function num(v) { const n = Number(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : 999999; }
function round1(n) { return Math.round(Number(n) * 10) / 10; }
function unique(arr) { return [...new Set(arr.map(String))].filter(Boolean); }
function normalizeKey(v) { return normalizeColumnName(v).replace(/\s/g, ''); }
function makeId(sheetName, row, variety, se) { return normalizeKey([sheetName, se, variety, cleanCell(row.join('|'))].join('|')).slice(0, 80) + '-' + Math.random().toString(36).slice(2, 8); }
function calculateTreeCount(start, end) { const a = Number(start), b = Number(end); return Number.isFinite(a) && Number.isFinite(b) && b >= a ? b - a + 1 : ''; }
function parseISODate(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s || ''))) return null; const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y, m-1, d)); }
function toISODate(d) { return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`; }
function formatYMD(y, m, d) { const date = new Date(Date.UTC(y, m-1, d)); return isNaN(date) ? '' : toISODate(date); }
function todayISO() { return toISODate(new Date()); }
function diffDays(fromISO, toISO) { const a = parseISODate(fromISO), b = parseISODate(toISO); if (!a || !b) return null; return Math.round((b-a)/86400000); }
function compareDate(a,b) { if (!a && !b) return 0; if (!a) return 1; if (!b) return -1; return String(a).localeCompare(String(b)); }
function displayDate(d) { return d ? d.split('-').reverse().join('/') : '—'; }
function fmtDateTime(iso) { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('fr-FR'); }
function isLate(r) { const d = diffDays(todayISO(), r.correctedThinningDate); return d !== null && d < 0 && !isDoneRecord(r); }
function needsComment(r) { return (Number(r.calculatedRate) === 0 || Number(r.calculatedRate) >= 80 || r.calculatedRateClass === 'dégroupage') && !r.comment; }
function groupCount(records, fn) { return records.reduce((acc, r) => { const k = fn(r) || '—'; acc[k] = (acc[k] || 0) + 1; return acc; }, {}); }
function priorityColor(p) { return p === 'Urgent' ? 'red' : p === 'Haute' ? 'orange' : p === 'Moyenne' ? 'blue' : p === 'Terminé' ? 'green' : 'gray'; }
function statusColor(s) { return s === 'à vérifier' ? 'red' : s === 'contrôle final réalisé' ? 'green' : s === 'éclaircissage réalisé' ? 'blue' : s === 'prête à éclaircir' ? 'orange' : 'gray'; }
function rateColor(r) { return Number(r) >= 80 ? 'red' : Number(r) >= 66 ? 'orange' : Number(r) > 0 ? 'green' : 'gray'; }
function escapeHtml(v) { return String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(v) { return escapeHtml(v).replace(/'/g, '&#39;'); }
function showToast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(() => toastEl.classList.remove('show'), 2200); }
function debounce(fn, wait) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); }; }

/* ============================================================================
   FILTRES PARTAGÉS : SUIVI ÉCLAIRCISSAGE ET SUIVI TAILLE
   Parcelles et périodes de maturité multisélectionnables ; les autres filtres
   demeurent identiques. L'ordre par défaut des listes est conservé.
   ========================================================================== */

/** null = toutes les options, [] = aucune ; tableau de valeurs = sélection précise.
 *  Ce modèle distingue « Tout sélectionner » de « Tout désélectionner ». */
function getFilters() {
  if (!state.filters || typeof state.filters !== 'object') state.filters = {};
  const f = state.filters;
  // Migration silencieuse des anciennes sélections uniques, sans toucher aux données terrain.
  if (!Object.prototype.hasOwnProperty.call(f, 'parcels')) f.parcels = f.parcel ? [String(f.parcel)] : null;
  if (!Object.prototype.hasOwnProperty.call(f, 'maturities')) f.maturities = f.maturity ? [String(f.maturity)] : null;
  if (f.parcels !== null && !Array.isArray(f.parcels)) f.parcels = null;
  if (f.maturities !== null && !Array.isArray(f.maturities)) f.maturities = null;
  if (Array.isArray(f.maturities)) {
    // Les filtres précédemment enregistrés restent utilisables après la mise à jour.
    f.maturities = [...new Set(f.maturities.map(v => LEGACY_MATURITY_LABELS[v] || v))];
  }
  for (const k of ['shape', 'preWork', 'pruningType', 'week']) if (typeof f[k] !== 'string') f[k] = '';
  delete f.parcel;
  delete f.maturity;
  delete f.sort;
  return f;
}

function refreshActiveSectionList() {
  if (state.activeSection === 'pruning') renderPruningList();
  else renderList();
}

/** OU à l'intérieur d'un filtre multiple, ET entre les différents filtres. */
function applySharedFilters(records, section) {
  const f = getFilters();
  let list = records;
  if (f.parcels !== null) list = list.filter(r => f.parcels.includes(String(r.parcel || r.group || '')));
  if (f.maturities !== null) list = list.filter(r => f.maturities.includes(pruningMaturityBucket(r)));
  if (f.shape) list = list.filter(r => (isFlat(r) ? 'flat' : 'round') === f.shape);
  if (f.pruningType) list = list.filter(r => (f.pruningType === 'none' ? !r.pruningType : r.pruningType === f.pruningType));
  if (f.preWork) {
    const done = f.preWork === 'done';
    list = list.filter(r => hasPreWork(r, section) === done);
  }
  if (f.week && section === 'thinning') list = list.filter(r => String(r.thinningWeek) === String(f.week));
  return list;
}

/** Ordre naturel du suivi taille : parcelle, rang, puis premier arbre. */
function sortRecordsByParcelPosition(records) {
  return records.slice().sort((a, b) => {
    const parcelDiff = String(a.parcel || a.group || '').localeCompare(String(b.parcel || b.group || ''), 'fr', { numeric: true });
    if (parcelDiff !== 0) return parcelDiff;
    const rowDiff = num(a.row) - num(b.row);
    if (rowDiff !== 0) return rowDiff;
    return num(a.treeStart) - num(b.treeStart);
  });
}

/** Panneau commun, avec cases explicites et raccourcis Tout/Aucun. */
function multiFilterGroup(key, title, values) {
  const selected = getFilters()[key];
  const all = selected === null;
  const count = all ? values.length : selected.length;
  return `<div class="filter-multi-heading">
      <p class="filter-label">${escapeHtml(title)}</p>
      <span class="filter-multi-count">${count} / ${values.length} sélectionné(s)</span>
    </div>
    <div class="filter-multi-actions">
      <button type="button" onclick="setMultiFilterAll('${key}',true)">Tout sélectionner</button>
      <button type="button" onclick="setMultiFilterAll('${key}',false)">Tout désélectionner</button>
    </div>
    <div class="filter-multi-grid" data-filter-key="${key}" role="group" aria-label="${escapeAttr(title)}">
      ${values.map(v => {
        const checked = all || selected.includes(v);
        return `<label class="filter-multi-option ${checked ? 'is-checked' : ''}">

}

function toggleMultiFilter(key, value, checked) {
  if (key !== 'parcels' && key !== 'maturities') return;
  const f = getFilters();
  const options = multiFilterOptions(key);
  const choices = new Set(f[key] === null ? options : f[key]);
  if (checked) choices.add(value); else choices.delete(value);
  f[key] = choices.size === options.length ? null : options.filter(item => choices.has(item));
  refreshActiveSectionList();
  renderFilterSheet();
}

function setMultiFilterAll(key, checked) {
  if (key !== 'parcels' && key !== 'maturities') return;
  getFilters()[key] = checked ? null : [];
  refreshActiveSectionList();
  renderFilterSheet();
}

/** Les autres filtres restent à choix unique. */

  if (!['shape', 'preWork', 'pruningType', 'week'].includes(key)) return;
  getFilters()[key] = value;
  refreshActiveSectionList();
  renderFilterSheet();
}

function resetFilters() {
  state.filters = { parcels: null, maturities: null, shape: '', preWork: '', pruningType: '', week: '' };
  refreshActiveSectionList();
  renderFilterSheet();
}

/* ============================================================================
   v26 - BASE VARIÉTALE UNIQUE
   Une variété n'existe qu'une seule fois dans la base. Elle porte une ou
   plusieurs plantations (parcelle + rang + arbres). Les enregistrements de
   travail (éclaircissage, taille) restent attachés à chaque plantation.
   ========================================================================== */

const VARIETY_FIELDS = ['se', 'variety', 'denomination', 'clone', 'protection', 'maturityDate', 'typeFruit'];
const VARIETY_MIRROR_ALWAYS = ['se', 'variety', 'denomination', 'clone', 'protection', 'typeFruit'];

/** Clé d'identité stricte, utilisée pour les comparaisons exactes. */
function varietyIdentityKey(source) {
  return normalizeKey([source?.se, source?.variety, source?.clone].join('|'));
}

/** Numéro de variété normalisé : ni casse, ni accents, ni espaces, ni séparateurs.
 *  « PLAT-5 », « plat 5 » et « PLAT5 » désignent donc la même variété. */
function normalizeVarietyCode(value) {
  return normalizeKey(value || '').replace(/[^a-z0-9]/g, '');
}

/** Deux fiches désignent-elles la même variété ?
 *  Le numéro de variété fait foi à lui seul : il ne peut pas exister deux fois dans la base.
 *  À défaut de numéro, la dénomination sert de repère. */
function matchesVarietyIdentity(a, b) {
  const av = normalizeVarietyCode(a?.variety);
  const bv = normalizeVarietyCode(b?.variety);
  if (av && bv) return av === bv;
  if (av || bv) return false;
  const ad = normalizeVarietyCode(a?.denomination);
  const bd = normalizeVarietyCode(b?.denomination);
  return !!ad && ad === bd;
}

/** Quantité d'informations portée par une fiche variété : sert à choisir laquelle garder. */
function varietyInfoScore(entry) {
  let score = 0;
  VARIETY_FIELDS.forEach(f => { if (String(entry?.[f] ?? '').trim()) score += 1; });
  score += (state.records || []).filter(r => r.varietyId === entry?.id).length * 2;
  return score;
}

function makeVarietyId(source) {
  const base = normalizeKey([source?.se, source?.variety, source?.clone].join('-')).slice(0, 40) || 'variete';
  return `var-${base}-${Math.random().toString(36).slice(2, 6)}`;
}

/** Rattache chaque plantation à une variété du catalogue et harmonise les données variétales. */
function ensureVarietyLinks() {
  if (!Array.isArray(state.varieties)) state.varieties = [];
  if (!Array.isArray(state.records)) state.records = [];

  // 1. Chaque plantation est rattachée à un groupe variétal
  const groups = state.varieties.map(v => ({ id: v.id, ref: v }));
  state.records.forEach(r => {
    if (r.varietyId && !groups.some(g => g.id === r.varietyId)) groups.push({ id: r.varietyId, ref: { ...r } });
  });
  state.records.forEach(r => {
    let group = r.varietyId ? groups.find(g => g.id === r.varietyId) : null;
    if (!group) group = groups.find(g => matchesVarietyIdentity(g.ref, r));
    if (!group) {
      group = { id: makeVarietyId(r), ref: { se: r.se, variety: r.variety, clone: r.clone, denomination: r.denomination } };
      groups.push(group);
    }
    r.varietyId = group.id;
  });

  // 2. Le catalogue contient une entrée par variété rencontrée
  const catalogue = new Map(state.varieties.map(v => [v.id, v]));
  state.records.forEach(r => {
    let entry = catalogue.get(r.varietyId);
    if (!entry) {
      entry = { id: r.varietyId };
      VARIETY_FIELDS.forEach(f => { entry[f] = r[f] || ''; });
      catalogue.set(entry.id, entry);
    } else {
      VARIETY_FIELDS.forEach(f => { if (!String(entry[f] ?? '').trim() && r[f]) entry[f] = r[f]; });
    }
  });
  state.varieties = [...catalogue.values()];

  // 2 bis. Un même numéro de variété ne peut exister qu'une fois :
  // la fiche la plus complète est conservée, l'autre est supprimée après récupération de ses données.
  const merged = [];
  state.varieties.forEach(entry => {
    const twinIndex = merged.findIndex(m => matchesVarietyIdentity(m, entry));
    if (twinIndex < 0) { merged.push(entry); return; }
    const twin = merged[twinIndex];
    const keeper = varietyInfoScore(entry) > varietyInfoScore(twin) ? entry : twin;
    const dropped = keeper === twin ? entry : twin;
    VARIETY_FIELDS.forEach(f => { if (!String(keeper[f] ?? '').trim() && dropped[f]) keeper[f] = dropped[f]; });
    state.records.forEach(r => { if (r.varietyId === dropped.id) r.varietyId = keeper.id; });
    if (state.varietyEditId === dropped.id) state.varietyEditId = keeper.id;
    merged[twinIndex] = keeper;
    catalogue.delete(dropped.id);
  });
  state.varieties = merged;

  // 2 ter. Deux plantations identiques (même variété, même parcelle, même position) n'en font qu'une
  const positions = new Map();
  const duplicates = [];
  state.records.forEach(r => {
    const key = [r.varietyId, normalizeKey(r.parcel || r.group || ''), normalizeKey(r.row), normalizeKey(r.treeStart)].join('|');
    if (!normalizeKey(r.row) && !normalizeKey(r.treeStart)) return;
    const first = positions.get(key);
    if (!first) { positions.set(key, r); return; }
    const keep = recordInfoScore(r) > recordInfoScore(first) ? r : first;
    const drop = keep === first ? r : first;
    positions.set(key, keep);
    duplicates.push(drop.id);
  });
  if (duplicates.length) state.records = state.records.filter(r => !duplicates.includes(r.id));

  // 3. Les plantations reflètent les données de leur variété
  state.records.forEach(r => {
    const entry = catalogue.get(r.varietyId);
    if (!entry) return;
    VARIETY_MIRROR_ALWAYS.forEach(f => { if (entry[f]) r[f] = entry[f]; });
    if (!String(r.maturityDate ?? '').trim() && entry.maturityDate) r.maturityDate = entry.maturityDate;
  });

  return state.varieties;
}

/** Quantité de saisie portée par une plantation : sert à choisir laquelle garder en cas de doublon. */
function recordInfoScore(record) {
  let score = 0;
  ['maturityDate', 'treeEnd', 'treeCount', 'completionDate', 'comment', 'pruningDate', 'pruningType'].forEach(f => {
    if (String(record?.[f] ?? '').trim()) score += 1;
  });
  if (record?.finished || record?.thinningFinished) score += 3;
  if (record?.pruningFinished) score += 3;
  if (getPruningCounts(record)) score += 2;
  if (hasCompleteBranchCounts(record)) score += 3;
  return score;
}

function getVarietyCatalogue() {
  ensureVarietyLinks();
  return state.varieties.slice().sort((a, b) => String(a.variety || '').localeCompare(String(b.variety || ''), 'fr'));
}

function getVarietyEntry(varietyId) {
  ensureVarietyLinks();
  return state.varieties.find(v => v.id === varietyId) || null;
}

function findVarietyByIdentity(source) {
  ensureVarietyLinks();
  return state.varieties.find(v => matchesVarietyIdentity(v, source)) || null;
}

function getPlantings(varietyId) {
  return state.records.filter(r => r.varietyId === varietyId)
    .sort((a, b) => String(a.parcel || '').localeCompare(String(b.parcel || '')) || num(a.row) - num(b.row) || num(a.treeStart) - num(b.treeStart));
}

function varietyTreeTotal(varietyId) {
  return getPlantings(varietyId).reduce((sum, r) => sum + getWorkloadTreeCount(r), 0);
}

function varietyParcels(varietyId) {
  return unique(getPlantings(varietyId).map(r => r.parcel || r.group || 'Sans parcelle'));
}

/** Applique les données d'une variété à toutes ses plantations. */
function applyVarietyToPlantings(varietyId, changedFields = []) {
  const entry = getVarietyEntry(varietyId);
  if (!entry) return;
  getPlantings(varietyId).forEach(r => {
    VARIETY_MIRROR_ALWAYS.forEach(f => { if (entry[f]) r[f] = entry[f]; });
    if (changedFields.includes('maturityDate')) r.maturityDate = entry.maturityDate || '';
    else if (!String(r.maturityDate ?? '').trim() && entry.maturityDate) r.maturityDate = entry.maturityDate;
    r.lastModified = new Date().toISOString();
    recalculateRecord(r);
  });
}

}

/* -------------------------------------------------------- édition variété */

async function saveVariety() {
  const se = cleanCell(document.getElementById('varietyFormSe')?.value || '');
  const variety = cleanCell(document.getElementById('varietyFormCode')?.value || '');
  const denomination = cleanCell(document.getElementById('varietyFormDenomination')?.value || '');
  const clone = cleanCell(document.getElementById('varietyFormClone')?.value || '');
  const protection = cleanCell(document.getElementById('varietyFormProtection')?.value || '');
  const maturityDate = normalizeDate(document.getElementById('varietyFormMaturity')?.value || '');

  if (!se) return showToast('Champ obligatoire : SE');
  if (!variety) return showToast('Champ obligatoire : Variété');

  ensureVarietyLinks();
  const editing = state.varietyEditId ? getVarietyEntry(state.varietyEditId) : null;
  const twin = state.varieties.find(v => v.id !== (editing?.id || '') && matchesVarietyIdentity(v, { se, variety, clone }));
  if (twin) return showToast(`${twin.variety} existe déjà dans la base`);

  if (editing) {
    const changed = [];
    if (editing.maturityDate !== maturityDate) changed.push('maturityDate');
    Object.assign(editing, { se, variety, denomination, clone, protection, maturityDate });
    applyVarietyToPlantings(editing.id, changed);
    state.varietyEditId = null;
    showToast('Variété modifiée');
  } else {
    const entry = { id: makeVarietyId({ se, variety, clone }), se, variety, denomination, clone, protection, maturityDate, typeFruit: '' };
    state.varieties.push(entry);
    showToast('Variété créée');
  }
  await saveLocalData(false);
  renderTreesManagement();
}

function editVariety(varietyId) {
  state.varietyEditId = varietyId;
  renderTreesManagement();
  requestAnimationFrame(() => window.scrollTo({ top: 0, left: 0, behavior: 'auto' }));
}

function cancelVarietyEdit() {
  state.varietyEditId = null;
  renderTreesManagement();
}

/** Demande de suppression : affiche l'impact avant toute modification. */
function deleteVariety(varietyId) {
  const entry = getVarietyEntry(varietyId);
  if (!entry) return;
  const plantings = getPlantings(varietyId);
  const parcels = varietyParcels(varietyId);
  const label = String(entry.variety || entry.denomination || 'Cette variété');
  document.getElementById('varietyDeleteDialog')?.remove();
  const overlay = document.createElement('div');
  overlay.id = 'varietyDeleteDialog';
  overlay.className = 'prune-sheet-overlay';
  overlay.innerHTML = `<section class="prune-sheet" role="dialog" aria-modal="true" aria-labelledby="varietyDeleteTitle">
    <div class="prune-sheet-head">
      <h2 class="prune-sheet-title" id="varietyDeleteTitle">Supprimer une variété</h2>
      <button type="button" class="menu-close-btn" aria-label="Fermer" onclick="closeVarietyDeleteDialog()">×</button>
    </div>
    <p><strong>${escapeHtml(label)}</strong>${entry.denomination && entry.denomination !== entry.variety ? ' · ' + escapeHtml(entry.denomination) : ''}</p>
    <div class="variety-danger-info">
      <strong>Suppression définitive de la base variétale</strong>
      <div>Cette action supprimera ${plantings.length} plantation(s) dans ${parcels.length} parcelle(s) et toutes les données de suivi éclaircissage / taille correspondantes.</div>
      ${parcels.length ? `<div style="margin-top:6px">Parcelles concernées : ${escapeHtml(parcels.join(', '))}</div>` : ''}
      <div style="margin-top:8px">Les autres variétés et leurs suivis ne seront pas affectés. Les archives de l'onglet Historique sont conservées.</div>
    </div>
    ${plantings.length ? `<div class="variety-deletion-confirm">
      <label for="varietyDeleteInput">Saisir SUPPRIMER pour confirmer</label>
      <input id="varietyDeleteInput" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="SUPPRIMER" />
    </div>` : ''}
    <div class="variety-delete-actions">
      <button type="button" class="btn secondary" onclick="closeVarietyDeleteDialog()">Annuler</button>
      <button type="button" id="varietyDeleteFinalButton" class="btn red" onclick="confirmVarietyDeletion('${escapeAttr(varietyId)}')" ${plantings.length ? 'disabled' : ''}>Supprimer définitivement</button>
    </div>
  </section>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeVarietyDeleteDialog(); });
  document.body.appendChild(overlay);

async function savePlanting(varietyId, plantingId) {
  const entry = getVarietyEntry(varietyId);
  if (!entry) return;
  const parcel = String(document.getElementById('plantingParcel')?.value || '').trim();
  const row = cleanCell(document.getElementById('plantingRow')?.value || '');
  const treeStart = cleanCell(document.getElementById('plantingStart')?.value || '');
  const treeEndRaw = cleanCell(document.getElementById('plantingEnd')?.value || '');
  const countRaw = cleanCell(document.getElementById('plantingCount')?.value || '');
  const maturityDate = normalizeDate(document.getElementById('plantingMaturity')?.value || '');

  if (!parcel) return showToast('Choisir une parcelle');
  if (!row) return showToast('Champ obligatoire : Rang');
  if (!treeStart) return showToast('Champ obligatoire : Arbre de début');
  const treeEnd = treeEndRaw || treeStart;
  if (num(treeEnd) < num(treeStart)) return showToast('Arbre de fin inférieur au début');
  const treeCount = countRaw || calculateTreeCount(treeStart, treeEnd) || '';

  const twin = state.records.find(r => r.id !== plantingId && r.varietyId === varietyId
    && String(r.parcel || '') === parcel && normalizeKey(r.row) === normalizeKey(row) && normalizeKey(r.treeStart) === normalizeKey(treeStart));
  if (twin) return showToast('Cette plantation existe déjà');

  const occupied = state.records.find(r => r.id !== plantingId && r.varietyId !== varietyId
    && String(r.parcel || '') === parcel && normalizeKey(r.row) === normalizeKey(row) && normalizeKey(r.treeStart) === normalizeKey(treeStart));
  if (occupied && !confirm(`La position R${row} A${treeStart} est déjà occupée par ${occupied.variety || 'une autre variété'}. Continuer ?`)) return;

  const existing = plantingId ? state.records.find(r => r.id === plantingId) : null;
  if (existing) {
    Object.assign(existing, { parcel, group: parcel, row, treeStart, treeEnd, treeCount, maturityDate, lastModified: new Date().toISOString() });
    recalculateRecord(existing);
    showToast('Plantation modifiée');
  } else {
    state.records.push(createPlantingRecord(entry, { parcel, row, treeStart, treeEnd, treeCount, maturityDate }));
    showToast('Parcelle ajoutée à la variété');
  }
  if (!state.customParcels.includes(parcel) && !getAllParcels().includes(parcel)) state.customParcels.push(parcel);
  ensureVarietyLinks();
  await saveLocalData(false);
  closePlantingEditor();
  renderTreesManagement();
}

/** Crée une plantation rattachée à une variété du catalogue. */
function createPlantingRecord(entry, position) {
  return recalculateRecord({
    id: `plant-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    varietyId: entry.id,
    group: position.parcel,
    parcel: position.parcel,
    se: entry.se || '',
    variety: entry.variety || '',
    denomination: entry.denomination || '',
    clone: entry.clone || '',
    protection: entry.protection || '',
    typeFruit: entry.typeFruit || '',
    row: position.row || '',
    treeStart: position.treeStart || '',
    treeEnd: position.treeEnd || position.treeStart || '',
    treeCount: position.treeCount || calculateTreeCount(position.treeStart, position.treeEnd) || '',
    maturityDate: position.maturityDate || entry.maturityDate || '',
    importedThinningDate: '',
    manualDate: '',
    completionDate: '',
    observationDate: '',
    stoneHardeningDate: '',
    recommendedLoad: '',
    historicalRate: '',
    historicalClass: '',
    status: 'à observer',
    finished: false,
    degrouping: false,
    comment: '',
    misc: '',
    branches: emptyBranches(),
    lastModified: new Date().toISOString()
  });
}

async function deletePlanting(plantingId) {
  const record = state.records.find(r => r.id === plantingId);
  if (!record) return;
  if (!confirm(`Supprimer la plantation ${record.parcel || ''} ${formatTreePosition(record)} ? Les observations liées seront perdues.`)) return;
  state.records = state.records.filter(r => r.id !== plantingId);
  await saveLocalData(false);
  showToast('Plantation supprimée');
  renderTreesManagement();
}

/* ============================================================================
   v25 - IMPORT DU PLAN D'UNE PARCELLE
   Depuis la page Parcelles, import d'un fichier Excel décrivant le plan :
   SE / Variété / Dénomination / Clone / Protection / Rang / Arbre de début /
   Arbre de fin / Nb Arbres. Les lignes sont rattachées à la parcelle choisie.
   ========================================================================== */

const PARCEL_PLAN_COLUMNS = ['SE', 'Variété', 'Dénomination', 'Clone', 'Protection', 'Rang', 'Arbre de début', 'Arbre de fin', 'Nb Arbres'];

const PARCEL_PLAN_ALIASES = {
  se: ['se', 'code se', 'sous espece', 'sous-espece', 'type'],
  variety: ['variete', 'variété', 'cultivar', 'reference', 'référence', 'code variete', 'code'],
  denomination: ['denomination', 'dénomination', 'nom commercial', 'nom'],
  clone: ['clone', 'n clone', 'numero clone'],
  protection: ['protection', 'protection variete', 'obtention', 'pi', 'cov', 'statut protection'],
  row: ['rang', 'rangee', 'rangée', 'row', 'n rang'],
  treeStart: ['arbre de debut', 'arbre de début', 'arbre debut', 'debut', 'début', 'premier arbre', 'start tree'],
  treeEnd: ['arbre de fin', 'arbre fin', 'fin', 'dernier arbre', 'end tree'],
  treeCount: ['nb arbres', 'nb arbre', 'nombre arbres', 'nombre d arbres', 'nombre d arbre', 'effectif'],
  maturityDate: ['mat', 'maturite', 'maturité', 'date maturite', 'date maturité', 'date recolte', 'date récolte']
};

const PARCEL_PLAN_REQUIRED = ['variety', 'row', 'treeStart'];

/** Construit la correspondance colonne -> champ pour un plan de parcelle. */
function createPlanFieldMap(header) {
  const map = {};
  const used = new Set();
  Object.entries(PARCEL_PLAN_ALIASES).forEach(([field, aliases]) => {
    const normalized = aliases.map(normalizeColumnName);
    let idx = header.findIndex((h, i) => !used.has(i) && h && normalized.includes(h));
    if (idx < 0) idx = header.findIndex((h, i) => !used.has(i) && h && normalized.some(a => h === a || h.startsWith(a + ' ') || a.startsWith(h + ' ')));
    if (idx >= 0) used.add(idx);
    map[field] = idx >= 0 ? idx : null;
  });
  return map;
}

/** Repère la ligne d'en-tête d'un plan de parcelle (indépendante de la maturité). */
function detectPlanHeaderRow(rows) {
  let bestIndex = -1;
  let bestScore = 0;
  rows.slice(0, 30).forEach((row, idx) => {
    if (!Array.isArray(row)) return;
    const normalized = row.map(normalizeColumnName);
    const map = createPlanFieldMap(normalized);
    let score = Object.values(map).filter(v => v !== null).length;
    if (map.variety !== null) score += 3;
    if (map.row !== null) score += 2;
    if (map.treeStart !== null) score += 2;
    if (score > bestScore) { bestScore = score; bestIndex = idx; }
  });
  return bestScore >= 4 ? bestIndex : -1;
}

/** Lit le classeur et prépare les lignes du plan pour la parcelle visée. */
function parseParcelPlan(workbook, parcel) {
  const result = { parcel, sheetName: '', rows: [], issues: [], missingColumns: [], detectedColumns: [] };
  const preferred = workbook.SheetNames.find(name => normalizeKey(name) === normalizeKey(parcel));
  const order = preferred ? [preferred, ...workbook.SheetNames.filter(n => n !== preferred)] : workbook.SheetNames;

  for (const sheetName of order) {
    const sheet = workbook.Sheets[sheetName];
    if (!sheet) continue;
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: '' });
    if (!rows.length) continue;
    const headerIndex = detectPlanHeaderRow(rows);
    if (headerIndex < 0) continue;

    const header = rows[headerIndex].map(normalizeColumnName);
    const map = createPlanFieldMap(header);
    result.sheetName = sheetName;
    result.detectedColumns = Object.entries(map).filter(([, idx]) => idx !== null).map(([field]) => field);
    result.missingColumns = Object.entries(map).filter(([field, idx]) => idx === null && field !== 'maturityDate').map(([field]) => field);

    for (let i = headerIndex + 1; i < rows.length; i++) {
      const row = rows[i];
      if (!row || row.every(cell => isBlankOrExcelError(cell))) continue;
      const variety = cleanCell(getCell(row, header, map.variety));
      const se = cleanCell(getCell(row, header, map.se));
      const rowNumber = cleanCell(getCell(row, header, map.row));
      const treeStart = cleanCell(getCell(row, header, map.treeStart));
      const treeEnd = cleanCell(getCell(row, header, map.treeEnd));
      let treeCount = cleanCell(getCell(row, header, map.treeCount));
      if (!variety && !se && !rowNumber && !treeStart) continue;

      const expected = calculateTreeCount(treeStart, treeEnd);
      const line = {
        line: i + 1,
        se,
        variety,
        denomination: cleanCell(getCell(row, header, map.denomination)),
        clone: cleanCell(getCell(row, header, map.clone)),
        protection: cleanCell(getCell(row, header, map.protection)),
        row: rowNumber,
        treeStart,
        treeEnd,
        treeCount: treeCount || expected || '',
        maturityDate: normalizeDate(getCell(row, header, map.maturityDate)),
        issues: []
      };
      if (!line.variety) line.issues.push('variété manquante');
      if (!line.se) line.issues.push('SE manquant');
      if (!line.row) line.issues.push('rang manquant');
      if (!line.treeStart) line.issues.push('arbre de début manquant');
      if (treeCount && expected && num(treeCount) !== Number(expected)) {
        line.issues.push(`Nb Arbres ${treeCount} ≠ ${expected} attendu(s) entre A${treeStart} et A${treeEnd}`);
      }
      if (line.treeEnd && num(line.treeEnd) < num(line.treeStart)) line.issues.push('arbre de fin inférieur au début');
      result.rows.push(line);
    }
    break;
  }

  // Doublons de position à l'intérieur du fichier
  const seen = new Map();
  result.rows.forEach(line => {
    const key = `${normalizeKey(line.row)}|${normalizeKey(line.treeStart)}`;
    if (line.row && line.treeStart) {
      if (seen.has(key)) line.issues.push(`même position que la ligne ${seen.get(key)}`);
      else seen.set(key, line.line);
    }
  });
  result.issues = result.rows.filter(l => l.issues.length);
  result.valid = result.rows.filter(l => PARCEL_PLAN_REQUIRED.every(f => String(l[f] || '').trim() !== ''));
  return result;
}

/* --------------------------------------- rapprochement avec la base variétale */

function samePlanPosition(a, b) {
  return normalizeKey(a?.row || '') === normalizeKey(b?.row || '')
    && normalizeKey(a?.treeStart || '') === normalizeKey(b?.treeStart || '');
}

/** Retrouve la plantation déjà enregistrée qui correspond à une ligne de plan. */
function findExistingForPlanLine(line, parcel, pool) {
  const records = pool || state.records;
  const entry = findVarietyByIdentity(line);
  const inParcel = records.filter(r => String(r.parcel || '') === String(parcel));
  if (entry) {
    const position = inParcel.find(r => r.varietyId === entry.id && samePlanPosition(r, line));
    if (position) return { record: position, kind: 'position', varietyId: entry.id };
    const sameParcel = inParcel.find(r => r.varietyId === entry.id);
    if (sameParcel) return { record: sameParcel, kind: 'sameParcel', varietyId: entry.id };
    return { record: null, kind: 'knownVariety', varietyId: entry.id };
  }
  const taken = inParcel.find(r => samePlanPosition(r, line));
  if (taken) return { record: taken, kind: 'positionTaken', varietyId: taken.varietyId };
  return null;
}

/** Annote chaque ligne valide du plan avec la variété déjà présente correspondante. */
function annotatePlanMatches(preview) {
  const pool = state.records;
  preview.valid.forEach(line => {
    const match = findExistingForPlanLine(line, preview.parcel, pool);
    line.match = match ? {
      id: match.record ? match.record.id : '',
      kind: match.kind,
      varietyId: match.varietyId || '',
      parcel: match.record ? (match.record.parcel || '') : '',
      variety: match.record ? (match.record.variety || '') : ''
    } : null;
  });
  preview.counts = {
    nouvelles: preview.valid.filter(l => !l.match).length,
    plantationsConnues: preview.valid.filter(l => l.match && (l.match.kind === 'position' || l.match.kind === 'sameParcel')).length,
    varietesConnues: preview.valid.filter(l => l.match && l.match.kind === 'knownVariety').length,
    positionOccupee: preview.valid.filter(l => l.match && l.match.kind === 'positionTaken').length
  };
  return preview;
}

/** Met à jour une variété existante avec les informations du plan, sans toucher aux observations. */
function updateRecordFromPlanLine(record, line, movePosition) {
  const oldKey = recordHistoryKey(record);
  if (!record.se && line.se) record.se = line.se;
  if (line.denomination) record.denomination = line.denomination;
  if (line.clone) record.clone = line.clone;
  if (line.protection) record.protection = line.protection;
  if (!record.maturityDate && line.maturityDate) record.maturityDate = line.maturityDate;
  if (movePosition) {
    if (line.row) record.row = line.row;
    if (line.treeStart) record.treeStart = line.treeStart;
    if (line.treeEnd) record.treeEnd = line.treeEnd;
    record.treeCount = line.treeCount || calculateTreeCount(record.treeStart, record.treeEnd) || record.treeCount;
  }
  record.lastModified = new Date().toISOString();
  recalculateRecord(record);
  const newKey = recordHistoryKey(record);
  if (oldKey !== newKey && Array.isArray(state.history)) {
    state.history.forEach(h => { if (String(h.key) === oldKey) h.key = newKey; });
  }
  return record;
}

function openParcelPlanImport(parcel) {
  state.parcelPlanTarget = parcel;

  input.value = '';
  input.click();

async function handleParcelPlanFile(event) {
  const file = event.target.files && event.target.files[0];
  const parcel = state.parcelPlanTarget;
  event.target.value = '';
  if (!file || !parcel) return;
  if (!window.XLSX) return showToast('SheetJS non disponible');
  try {
    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: 'array', cellDates: true, raw: true });
    const preview = annotatePlanMatches(parseParcelPlan(workbook, parcel));
    preview.fileName = file.name;
    if (!preview.rows.length) return showToast('Aucune ligne de plan détectée');
    state.parcelPlanPreview = preview;
    renderParcelPlanPreview();
  } catch (err) {
    console.error('Import plan parcelle', err);
    showToast('Erreur pendant la lecture du fichier');
  }
}

  if (!match) return '';
  if (match.kind === 'position') return `plantation déjà enregistrée dans ${parcel}`;
  if (match.kind === 'sameParcel') return `déjà plantée dans ${parcel} à une autre position`;
  if (match.kind === 'knownVariety') return 'variété déjà en base : nouvelle parcelle rattachée à sa fiche';
  if (match.kind === 'positionTaken') return `position déjà occupée par ${match.variety || 'une autre variété'}`;
  return '';
}

      </div>

      <button class="btn secondary" style="margin-top:8px;color:var(--red)" onclick="applyParcelPlanImport('replace')" ${preview.valid.length ? '' : 'disabled'}>Le plan fait référence (supprimer les absents)</button>
      <p class="prune-note">Les variétés déjà connues gardent leur maturité, leur historique et leurs observations : seules les informations du plan sont complétées.</p>
    </section>`;
  overlay.addEventListener('click', event => { if (event.target === overlay) closeParcelPlanPreview(); });
  document.body.appendChild(overlay);
}

function closeParcelPlanPreview() {
  state.parcelPlanPreview = null;
  state.parcelPlanTarget = null;
  document.getElementById('parcelPlanSheet')?.remove();
}

async function applyParcelPlanImport(importMode) {
  const preview = state.parcelPlanPreview;
  if (!preview || !preview.valid.length) return;
  annotatePlanMatches(preview);
  const parcel = preview.parcel;

  // Mode remplacement : le fichier fait référence. Les variétés de la parcelle absentes du plan
  // sont supprimées, celles qui y figurent sont mises à jour (leurs observations sont conservées).
  if (importMode === 'replace') {
    const inParcel = state.records.filter(r => String(r.parcel || '') === String(parcel));
    const kept = new Set(preview.valid.map(l => l.match && l.match.id ? l.match.id : null).filter(Boolean));
    const removed = inParcel.filter(r => !kept.has(r.id));
    if (removed.length && !confirm(`Remplacer le plan de ${parcel} ? ${removed.length} variété(s) absente(s) du fichier seront supprimées (leurs observations aussi).`)) return;
    state.records = state.records.filter(r => String(r.parcel || '') !== String(parcel) || kept.has(r.id));
  }

  let added = 0;
  let updated = 0;
  let newVarieties = 0;
  let conflicts = 0;

  preview.valid.forEach(line => {
    const match = findExistingForPlanLine(line, parcel);
    // Plantation déjà enregistrée : on la met à jour, jamais de doublon.
    if (match && (match.kind === 'position' || match.kind === 'sameParcel')) {
      updateRecordFromPlanLine(match.record, line, true);
      updated += 1;
      return;
    }
    // Position déjà occupée par une autre variété : on ne crée rien, la ligne est signalée.
    if (match && match.kind === 'positionTaken') { conflicts += 1; return; }
    // Variété déjà en base : on rattache simplement cette parcelle à sa fiche.
    let entry = match && match.varietyId && match.kind === 'knownVariety' ? getVarietyEntry(match.varietyId) : findVarietyByIdentity(line);
    if (!entry) {
      entry = {
        id: makeVarietyId(line),
        se: line.se || '',
        variety: line.variety || '',
        denomination: line.denomination || '',
        clone: line.clone || '',
        protection: line.protection || '',
        maturityDate: line.maturityDate || '',
        typeFruit: ''
      };
      state.varieties.push(entry);
      newVarieties += 1;
    } else {
      if (line.denomination) entry.denomination = line.denomination;
      if (line.clone && !entry.clone) entry.clone = line.clone;
      if (line.protection) entry.protection = line.protection;
      if (!entry.maturityDate && line.maturityDate) entry.maturityDate = line.maturityDate;
    }
    state.records.push(createPlantingRecord(entry, {
      parcel,
      row: line.row,
      treeStart: line.treeStart,
      treeEnd: line.treeEnd || line.treeStart,
      treeCount: line.treeCount,
      maturityDate: line.maturityDate || entry.maturityDate || ''
    }));
    added += 1;
  });
  ensureVarietyLinks();

  if (!state.customParcels.includes(parcel) && !getAllParcels().includes(parcel)) state.customParcels.push(parcel);
  state.parcelManagerSelected = parcel;
  await saveLocalData(false);
  closeParcelPlanPreview();
  const parts = [];
  if (added) parts.push(`${added} plantation(s) ajoutée(s)`);
  if (newVarieties) parts.push(`${newVarieties} nouvelle(s) variété(s)`);
  if (updated) parts.push(`${updated} mise(s) à jour`);
  if (conflicts) parts.push(`${conflicts} position(s) en conflit ignorée(s)`);
  showToast(parts.length ? parts.join(' · ') : 'Aucune modification');
  renderParcelsManagement();
}

/** Classe de maturité utilisée pour trier et regrouper le suivi taille. */
function pruningMaturityBucket(record) {

/* ------------------------------------------------- catalogue des types */

/** Retourne les types de taille : ceux créés par l'utilisateur, sinon les types par défaut. */
function getPruningTypes() {
  if (Array.isArray(state.pruningTypes) && state.pruningTypes.length) {
    return state.pruningTypes.filter(t => t && t.key);
  }
  return DEFAULT_PRUNING_TYPES.map(t => ({ ...t, color: (state.pruningColors || {})[t.key] || t.color }));
}
/** Matérialise le catalogue dans l'état pour pouvoir le modifier. */
function ensurePruningTypes() {
  if (!Array.isArray(state.pruningTypes) || !state.pruningTypes.length) {
    state.pruningTypes = getPruningTypes().map(t => ({ ...t }));
  }
  return state.pruningTypes;
}
/** Génère une clé unique et stable pour un nouveau type de taille. */
function makePruningTypeKey(label) {
  const base = normalizeSearchText(label).slice(0, 18) || 'type';
  const used = getPruningTypes().map(t => t.key);
  let key = base;
  let i = 2;
  while (used.includes(key)) { key = `${base}${i}`; i += 1; }
  return key;
}
function pruningTypeShort(type) {
  if (!type) return '';
  if (type.short) return type.short;
  const first = String(type.label || '').trim().split(/\s+/)[0] || 'Type';
  return first.length > 12 ? first.slice(0, 12) + '…' : first;
}
function pruningColorHex(key) {
  const info = pruningTypeInfo(key);
  return (info && info.color) || '#8e8e93';
}
function pruningColorName(hex) {
  const found = PRUNING_PALETTE.find(c => String(c.hex).toLowerCase() === String(hex || '').toLowerCase());
  return found ? found.name : 'Couleur';
}
function pruningTypeInfo(key) {
  return getPruningTypes().find(t => t.key === key) || null;
}
function pruningTypeLabel(key) {
  const info = pruningTypeInfo(key);
  return info ? info.label : 'Sans consigne';
}
function pruningStakeLabel(key) {
  const info = pruningTypeInfo(key);
  if (!info) return 'Aucun piquet';
  return `Piquet ${pruningColorName(pruningColorHex(key)).toLowerCase()}`;
}
/** Choisit un texte noir ou blanc selon la luminance de la couleur du piquet. */
function contrastText(hex) {
  const value = String(hex || '').replace('#', '');
  if (value.length !== 6) return '#1c1c1e';
  const r = parseInt(value.slice(0, 2), 16);
  const g = parseInt(value.slice(2, 4), 16);
  const b = parseInt(value.slice(4, 6), 16);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.6 ? '#1c1c1e' : '#ffffff';
}
async function setPruningColor(key, hex) {
  const types = ensurePruningTypes();
  const type = types.find(t => t.key === key);
  if (!type) return;
  type.color = hex;
  state.pruningColors = { ...(state.pruningColors || {}), [key]: hex };

async function savePruningTypeEditor() {
  readPruningDraftInputs();
  const draft = state.pruningTypeDraft;
  if (!draft) return;
  const label = String(draft.label || '').trim();
  if (!label) return showToast('Donner un nom au type de taille');
  const types = ensurePruningTypes();
  const duplicate = types.some(t => t.key !== draft.key && normalizeSearchText(t.label) === normalizeSearchText(label));
  if (duplicate) return showToast('Un type porte déjà ce nom');
  if (draft.isNew) {
    types.push({ key: makePruningTypeKey(label), label, short: String(draft.short || '').trim(), hint: String(draft.hint || '').trim(), color: draft.color });
  } else {
    const type = types.find(t => t.key === draft.key);
    if (!type) return;
    type.label = label;
    type.short = String(draft.short || '').trim();
    type.hint = String(draft.hint || '').trim();
    type.color = draft.color;
    state.pruningColors = { ...(state.pruningColors || {}), [type.key]: type.color };

async function deletePruningType(key) {
  const types = ensurePruningTypes();
  if (types.length <= 1) return showToast('Il faut conserver au moins un type de taille');
  const type = types.find(t => t.key === key);
  if (!type) return;
  const used = state.records.filter(r => r.pruningType === key);
  const message = used.length
    ? `Supprimer « ${type.label} » ? ${used.length} variété(s) perdront leur consigne de taille.`
    : `Supprimer « ${type.label} » ?`;
  if (!confirm(message)) return;
  state.pruningTypes = types.filter(t => t.key !== key);
  used.forEach(r => {
    const record = state.records.find(x => x.id === r.id);
    if (!record) return;
    record.pruningType = '';
    record.pruningFinished = false;
    record.lastModified = new Date().toISOString();
    recalculateRecord(record);
  });
  if (getFilters().pruningType === key) getFilters().pruningType = '';
  await saveLocalData(false);
  closePruningTypeEditor();
  showToast('Type de taille supprimé');
  renderPruningInstructions();

/* ------------------------------------------------------------ données taille */

/** Normalise les champs taille d'une variété (appelé par recalculateRecord). */
function normalizePruningRecord(record) {
  if (!record) return record;
  if (!getPruningTypes().some(t => t.key === record.pruningType)) record.pruningType = record.pruningType || '';
  if (record.pruningType && !pruningTypeInfo(record.pruningType)) record.pruningType = '';
  record.pruningFinished = !!record.pruningFinished;
  Object.values(PRUNING_COUNT_FIELDS).forEach(field => {
    record[field] = numberOrBlank(record[field]);
  });
  const counts = getPruningCounts(record);
  record.pruningShootTotal = counts ? counts.total : '';
  if (record.pruningFinished && !canFinishPruning(record)) record.pruningFinished = false;
  return record;
}

function getPruningCounts(record) {
  const small = numberOrBlank(record?.pruningShootSmall);
  const medium = numberOrBlank(record?.pruningShootMedium);
  const large = numberOrBlank(record?.pruningShootLarge);
  if (small === '' || medium === '' || large === '') return null;
  if (![small, medium, large].every(v => Number.isFinite(Number(v)) && Number(v) >= 0)) return null;
  return { small: Number(small), medium: Number(medium), large: Number(large), total: Number(small) + Number(medium) + Number(large) };
}
function hasCompletePruningCounts(record) {
  const counts = getPruningCounts(record);
  return !!counts && counts.total > 0;
}
function isPrunedRecord(record) {
  return !!(record && record.pruningFinished);
}
function canFinishPruning(record) {
  return !!(record && record.pruningType && record.pruningDate && hasCompletePruningCounts(record));
}
function getPruningValidationMessage(record) {
  if (!record.pruningType) return 'Choisir le type de taille (consigne piquet)';
  if (!record.pruningDate) return 'Renseigner la date de taille';
  if (!hasCompletePruningCounts(record)) return 'Compter les rameaux restants après taille';
  return '';
}
/** Reporte le comptage de taille dans la structure de l'arbre utilisée pour l'éclaircissage. */
function applyPruningCountsToStructure(id, silent = false) {
  const record = state.records.find(r => r.id === id);
  if (!record) return;
  const counts = getPruningCounts(record);
  if (!counts) return;
  record.shootSmall = counts.small;
  record.shootMedium = counts.medium;
  record.shootLarge = counts.large;
  record.lastModified = new Date().toISOString();
  recalculateRecord(record);
  saveLocalData(false);
  if (!silent) {
    showToast('Comptage reporté dans la structure de l’arbre');
    if (state.currentView === 'form') renderForm(id);
  }
}

function getPruningStats(records = state.records) {
  const list = Array.isArray(records) ? records : [];
  const total = list.length;
  const withType = list.filter(r => r.pruningType).length;
  const done = list.filter(isPrunedRecord).length;
  const byType = {};
  getPruningTypes().forEach(t => {
    const items = list.filter(r => r.pruningType === t.key);
    byType[t.key] = {
      varieties: items.length,
      trees: items.reduce((sum, r) => sum + getWorkloadTreeCount(r), 0),
      done: items.filter(isPrunedRecord).length
    };
  });
  return {
    total,
    withType,
    without: total - withType,
    done,
    remaining: withType - done,
    progress: total ? Math.round((done / total) * 100) : 0,
    byType
  };
}

/* -------------------------------------------------------------- liste taille */

function getFilteredPruningRecords() {
  let records = state.records.map(recalculateRecord);
  const q = normalizeColumnName(state.pruningSearch || '');
  if (q) {
    records = records.filter(r => normalizeColumnName(recordSearchHaystack(r, 'pruning')).includes(q));
  }
  records = applySharedFilters(records, 'pruning');
  switch (state.pruningFilter) {
    case 'Sans consigne': records = records.filter(r => !r.pruningType); break;
    case 'À tailler': records = records.filter(r => r.pruningType && !isPrunedRecord(r)); break;
    case 'Taillées': records = records.filter(isPrunedRecord); break;
  }
  return sortRecordsByParcelPosition(records);
}

    '<button class="list-action-btn stats" onclick="renderPruningInstructions()"><span class="icon">🪧</span><span>Piquets</span></button>') + `
    <main class="content">
      <div class="searchbar">
        <input id="pruningSearchInput" type="search" placeholder="Variété, SE, parcelle, rang…" value="${escapeAttr(state.pruningSearch || '')}" />
        ${filterButton()}

      <div class="chips" style="margin-top:12px">${PRUNING_FILTERS.map(f => `<button class="chip ${state.pruningFilter === f ? 'active' : ''}" onclick="setPruningFilter('${f}')">${f}</button>`).join('')}</div>
      <button type="button" class="btn secondary prune-bulk-entry" onclick="openBulkPruningSelector()" ${records.length ? '' : 'disabled'}><span class="bulk-symbol">☑</span><span>Attribuer une consigne groupée</span></button>
